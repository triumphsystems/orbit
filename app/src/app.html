<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#07090E" />
		<meta
			name="description"
			content="Orbit: Autonomous Goal-Driven Web Data Operations. Set the goal. Walk away."
		/>
		<title>Orbit — Autonomous Web Data Operations</title>

		<!-- OpenGraph -->
		<meta property="og:title" content="Orbit — Autonomous Web Data Operations" />
		<meta
			property="og:description"
			content="Set the goal. Walk away. Resilient proxy scraping, typed schema derivation, and scheduled background operations."
		/>
		<meta property="og:image" content="/logo.svg" />
		<meta property="og:type" content="website" />

		<!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-void text-slate-100 font-sans antialiased selection:bg-orbit-cyan/20 selection:text-orbit-cyan min-h-screen overflow-x-hidden"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
